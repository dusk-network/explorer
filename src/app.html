<!doctype html>
<html lang="en">
  <head>
    <title>Dusk Explorer</title>
    <meta charset="utf-8" />
    <meta
      name="description"
      content="Blocks, transactions, provisioners and staked DUSK on the Dusk network."
    />
    <!-- One head for every page and network: no canonical address, as each
      page is its own. Off mainnet, the Deploy workflow keeps the pages out
      of search results. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Dusk" />
    <meta property="og:title" content="Dusk Explorer" />
    <meta
      property="og:description"
      content="Blocks, transactions, provisioners and staked DUSK on the Dusk network."
    />
    <meta
      property="og:image"
      content="https://explorer.dusk.network/social.png"
    />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Dusk Explorer: blocks, transactions, provisioners and staked DUSK on the Dusk network. explorer.dusk.network"
    />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" type="image/png" href="%sveltekit.assets%/favicon.png" />
    <link
      rel="icon"
      type="image/svg+xml"
      href="%sveltekit.assets%/favicon.svg"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    %sveltekit.head%
  </head>
  <body
    data-sveltekit-preload-code="viewport"
    data-sveltekit-preload-data="hover"
  >
    <noscript>
      <h1>Dusk Explorer</h1>
      <p>
        The official block explorer for the Dusk network: blocks, transactions,
        accounts, provisioners and staked DUSK. It needs JavaScript.
      </p>
      <p>
        Official addresses: mainnet
        <a href="https://explorer.dusk.network/">explorer.dusk.network</a>,
        testnet
        <a href="https://explorer.testnet.dusk.network/"
          >explorer.testnet.dusk.network</a
        >. All of Dusk's apps:
        <a href="https://docs.dusk.network/learn/stay-safe/#official-apps"
          >docs.dusk.network/learn/stay-safe</a
        >.
      </p>
    </noscript>
    <div id="app-container">%sveltekit.body%</div>
  </body>
</html>
